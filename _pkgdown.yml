url: https://nifu-no.github.io/saros/
template:
  bootstrap: 5
  light-switch: yes
reference:
- title: The main function you will use
  desc: You use this function with the `type`-argument to create most things you'll
    need.
  contents: makeme
- title: Get, set and reset global options
  desc: Global options allow you to easily set defaults for all your makeme function
    calls, so you basically do not need to specify the same arguments throughout.
    data, dep and indep will still need to be specified.
  contents:
  - global_settings_get
  - global_settings_set
  - global_settings_reset
- title: Gets the possible data_label and type options for the makeme()-arguments
  contents:
  - get_data_label_opts
  - get_makeme_types
- title: Save output and create a link to it on rendering
  contents:
  - make_link
  - make_link.default
  - make_link.list
  - make_file_links
  - ggsaver
  - quarto_pdf_post_render
  - check_quarto_website_index
- title: "Advanced Palette-Retrieving ggiraph::girafe wrapper"
  contents:
  - girafe
- title: Generate figure captions and Quarto tabsets
  contents:
  - crowd_output
  - is_rendering
  - get_fig_title_suffix_from_ggplot
  - crowd_plots_as_tabset
  - crowd_plots_as_officer
  - crowd_plots_as_docx
  - crowd_tables_as_tabset
- title: Compute optimal figure heights for the built-in cat_plot
  contents:
  - fig_height_h_barchart
  - fig_height_h_barchart2
- title: Obtain sample size range for a makeme-object (experimental)
  contents:
  - n_range
  - n_range2
- title: Retrieve metadata attached to saros output objects
  contents:
  - get_dep_label_prefix
- title: Convert cat_plot-object to simple conditional text interpretations
  contents:
  - txt_from_cat_mesos_plots
- title: Insert text from a data frame by chunk name
  contents:
  - insert_text
- title: Detect the current output format
  contents:
  - output_format
- title: Only relevant when expanding the S3 system with your own functions
  contents: make_content
- title: Example dataset
  contents: ex_survey

